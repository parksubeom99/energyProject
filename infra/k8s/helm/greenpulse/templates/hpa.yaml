# GreenPulse HPA — 워커 오토스케일링
#
# 면접 포인트:
# "분석 워커가 코드 복잡도에 따라 CPU 부하가 변동합니다.
#  HPA가 CPU 70%를 초과하면 워커 Pod를 2→10개로 자동 증설하고,
#  부하가 줄면 다시 축소합니다. API 서버는 영향받지 않습니다."
#
# 시연:
# kubectl get hpa -n greenpulse → TARGETS, REPLICAS 확인
# 부하 발생 → Pod 수 증가 관찰
{{- if .Values.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-worker-hpa
  namespace: {{ .Values.global.namespace }}
  labels:
    app: greenpulse
    component: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-worker
  minReplicas: {{ .Values.hpa.worker.minReplicas }}
  maxReplicas: {{ .Values.hpa.worker.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.worker.targetCPUUtilizationPercentage }}
  behavior:
    # 스케일업: 빠르게 (분석 요청 폭증 대응)
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    # 스케일다운: 느리게 (과도한 축소 방지)
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
{{- end }}
